name: CI

on:
  push:
    branches:
      - main
    tags:
      - "!**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: life

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.3.1"
          elixir-version: "1.19.0"

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix test
      - run: mix dialyzer
      - run: mix credo --strict
