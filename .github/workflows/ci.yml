name: CI

on:
  push:
    branches:
      - main
    tags:
      - "!**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: life

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # v1.20.4
        with:
          otp-version: "28.3.1"
          elixir-version: "1.19.0"

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix test
      - run: mix dialyzer
      - run: mix credo --strict
