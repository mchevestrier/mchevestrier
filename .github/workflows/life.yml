name: Life

on:
  workflow_dispatch:
  schedule:
    - cron: "42 3 * * *"

permissions:
  contents: write

jobs:
  life:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: life

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.3.1"
          elixir-version: "1.19.0"

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix run -e 'GameOfLife.main'

      - name: Tempus Fugit
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add README.md life.rle
          git commit -m "Tempus Fugit" -m "Vulnerant omnes, ultima necat."
          git push
